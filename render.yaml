# Render Blueprint for the backend. Values marked sync: false are set in the dashboard.

services:
  - type: web
    name: lumajewel-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # Comma-separated allowed origins (the Vercel URL)
      - key: FRONTEND_ORIGIN
        sync: false
      # Fallback chain: try Groq, then Gemini, then the rule-based provider
      - key: LLM_PROVIDER
        value: groq,gemini,fake
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_MODEL
        value: gemini-flash-latest
      - key: CHAT_RATE_LIMIT_PER_HOUR
        value: "20"
      # API keys are set in the Render dashboard only
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
