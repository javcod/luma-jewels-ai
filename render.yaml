# Render Blueprint for the backend. Values marked sync: false are set in the dashboard.

services:
  - type: web
    name: lumajewel-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # Comma-separated allowed origins (the Vercel URL)
      - key: FRONTEND_ORIGIN
        sync: false
      # "fake" or "gemini"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-flash-latest
      # Set in the Render dashboard only
      - key: LLM_API_KEY
        sync: false
